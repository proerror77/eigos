name: Kernel release
# Publishes the query kernel binary of one reviewed main commit for the production host (x86_64, Ubuntu 24.04,
# glibc 2.39). It runs only when started by hand. The host downloads the binary and checks its SHA-256.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Main commit to publish (40 lowercase hex characters)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: kernel-release-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a main commit whose CI succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Give the full 40-character commit' >&2; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main" --jq .status)
          [[ "$status" == ahead || "$status" == identical ]] || { echo "$SOURCE_SHA is not on main" >&2; exit 1; }
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=success&per_page=1" --jq .total_count)
          [[ "$runs" -gt 0 ]] || { echo "CI has not succeeded on $SOURCE_SHA" >&2; exit 1; }
  binary:
    needs: gate
    # The production host's Ubuntu and glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Build the kernel from the exact source
        run: |
          cargo build --release --locked --manifest-path kernel/Cargo.toml
          mkdir -p "$RUNNER_TEMP/release"
          cp kernel/target/release/eigos-kernel kernel/target/release/eigos-archive "$RUNNER_TEMP/release/"
          strip "$RUNNER_TEMP/release/eigos-kernel" "$RUNNER_TEMP/release/eigos-archive"
      - name: Check that the binary starts and listens on loopback
        run: |
          binary="$RUNNER_TEMP/release/eigos-kernel"
          EIGOS_KERNEL_PORT=0 EIGOS_KERNEL_POLL_MS=0 "$binary" > "$RUNNER_TEMP/listening.json" &
          pid=$!
          for _ in $(seq 50); do [[ -s "$RUNNER_TEMP/listening.json" ]] && break; sleep 0.1; done
          port=$(jq -r 'select(.event == "kernel_listening") | .port' "$RUNNER_TEMP/listening.json")
          curl --fail --silent "http://127.0.0.1:$port/health" | jq -e '.status == "ok" and .loaded == false'
          kill -TERM "$pid"
          wait "$pid" || true
      - name: Check that the archive codec writes a row and reads it back
        run: |
          archive="$RUNNER_TEMP/release/eigos-archive"
          echo '{"owner":"o","xact":"1","commit_seq":"1","committed_at":"2026-01-01T00:00:00.000000Z"}' |
            "$archive" write change_commits "$RUNNER_TEMP/check.parquet" | jq -e '.rows == 1'
          "$archive" read change_commits '{}' "$RUNNER_TEMP/check.parquet" | jq -e '.commit_seq == "1" and .committed_at == "2026-01-01T00:00:00.000000Z"'
          rm "$RUNNER_TEMP/check.parquet"
      - name: Publish an immutable release for the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tag="kernel-${SOURCE_SHA:0:12}"
          cd "$RUNNER_TEMP/release"
          sha256sum eigos-kernel > eigos-kernel.sha256
          sha256sum eigos-archive > eigos-archive.sha256
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already exists; a release is never replaced" >&2
            exit 1
          fi
          gh release create "$tag" eigos-kernel eigos-kernel.sha256 eigos-archive eigos-archive.sha256 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Query kernel ${SOURCE_SHA:0:12}" \
            --notes "Query kernel built from $SOURCE_SHA on ubuntu-24.04 (x86_64, glibc 2.39). SHA-256: $(cut -d' ' -f1 eigos-kernel.sha256)"
