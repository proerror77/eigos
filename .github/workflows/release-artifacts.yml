name: Release artifacts
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit (40 lowercase hex characters)
        type: string
        required: true
      backend:
        description: Fixed Worker backend; native image checks run without credentials or model turns
        type: choice
        options: [codex, harness]
        default: codex
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: release-artifacts-${{ inputs.source_sha }}-${{ inputs.backend }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require explicit supported source and backend
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BACKEND: ${{ inputs.backend }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BACKEND" == codex || "$BACKEND" == harness ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - name: Validate exact checkout and packaging logic
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          node --test tests/release-artifacts.test.mjs
      - id: version
        run: node -e 'const fs=require("node:fs");fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${JSON.parse(fs.readFileSync("package.json")).version}\n`)'
      - name: Require terminal CI on this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          CI_RUN=$(node scripts/release-artifacts.mjs select-ci --source-sha "$SOURCE_SHA" --runs "$RUNNER_TEMP/ci-runs.json")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/ci-job-pages.json"
          node -e 'const fs=require("node:fs"),p=process.env.RUNNER_TEMP;fs.writeFileSync(p+"/ci-jobs.json",JSON.stringify({jobs:JSON.parse(fs.readFileSync(p+"/ci-job-pages.json")).flatMap(page=>page.jobs)}))'
          node scripts/release-artifacts.mjs ci-proof --source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" --runs "$RUNNER_TEMP/ci-runs.json" --jobs "$RUNNER_TEMP/ci-jobs.json" --out "$RUNNER_TEMP/ci-proof.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-proof-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/ci-proof.json
          if-no-files-found: error

  image:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: gateway
            target: gateway
          - role: relay
            target: relay
          - role: worker
            target: ${{ inputs.backend == 'harness' && 'worker-harness' || 'worker-codex' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: reference
        name: Preserve the immutable source tag
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ROLE: ${{ matrix.role }}
          BACKEND: ${{ inputs.backend }}
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}/$ROLE"
          TAG="$REPOSITORY:sha-$SOURCE_SHA-$BACKEND"
          if RESULT=$(docker buildx imagetools inspect "$TAG" 2>&1); then
            echo 'This immutable source tag is already published. Re-run only failed jobs instead of overwriting it.' >&2
            exit 1
          elif [[ "$RESULT" != *"not found"* && "$RESULT" != *"manifest unknown"* ]]; then
            echo 'Could not establish that the image tag is absent; publication stopped.' >&2
            exit 1
          fi
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build the native Worker for isolated validation before publication
        if: inputs.backend == 'harness' && matrix.role == 'worker'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: worker-harness
          platforms: linux/amd64
          push: false
          load: true
          tags: eigos-harness-release-check:${{ inputs.source_sha }}
          build-args: |
            SOURCE_SHA=${{ inputs.source_sha }}
            RELEASE_BACKEND=${{ inputs.backend }}
          provenance: false
          cache-from: type=gha,scope=release-${{ inputs.source_sha }}
      - name: Check the actual native SDK before registry publication
        if: inputs.backend == 'harness' && matrix.role == 'worker'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,mode=1777 --entrypoint node --env SOURCE_SHA --mount "type=bind,src=$PWD/scripts/smoke-harness-image.mjs,dst=/opt/eigos-smoke.mjs,readonly" "eigos-harness-release-check:$SOURCE_SHA" /opt/eigos-smoke.mjs
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.reference.outputs.tag }}
          build-args: |
            SOURCE_SHA=${{ inputs.source_sha }}
            RELEASE_BACKEND=${{ inputs.backend }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ inputs.source_sha }}
          cache-to: type=gha,mode=max,scope=release-${{ inputs.source_sha }}
      - name: Read the installed payload from each published role image
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BACKEND: ${{ inputs.backend }}
          IMAGE: ${{ steps.reference.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE"
          docker run --rm --network none --read-only --entrypoint node "$IMAGE" scripts/release-artifacts.mjs verify-image --root /app --source-sha "$SOURCE_SHA" --backend "$BACKEND" > "$RUNNER_TEMP/image-payload.json"
      - name: Verify the published native Worker by its returned immutable digest
        if: inputs.backend == 'harness' && matrix.role == 'worker'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE: ${{ steps.reference.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,mode=1777 --entrypoint node --env SOURCE_SHA --mount "type=bind,src=$PWD/scripts/smoke-harness-image.mjs,dst=/opt/eigos-smoke.mjs,readonly" "$IMAGE" /opt/eigos-smoke.mjs > "$RUNNER_TEMP/harness-image-smoke.json"
      - name: Record the returned digest and provenance metadata
        env:
          ROLE: ${{ matrix.role }}
          REPOSITORY: ${{ steps.reference.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          BACKEND: ${{ inputs.backend }}
        run: |
          node -e 'const fs=require("node:fs"),e=process.env;if(!/^sha256:[a-f0-9]{64}$/.test(e.IMAGE_DIGEST))throw Error("Missing returned OCI digest");const reference=`${e.REPOSITORY}@${e.IMAGE_DIGEST}`;fs.mkdirSync("image-result",{recursive:true});fs.writeFileSync(`image-result/${e.ROLE}.json`,JSON.stringify({role:e.ROLE,reference})+"\n");fs.copyFileSync(`${e.RUNNER_TEMP}/image-payload.json`,`image-result/${e.ROLE}-payload.json`);fs.writeFileSync(`image-result/${e.ROLE}-provenance.json`,e.BUILD_METADATA+"\n");if(e.BACKEND==="harness"&&e.ROLE==="worker"){const proof=JSON.parse(fs.readFileSync(`${e.RUNNER_TEMP}/harness-image-smoke.json`));fs.writeFileSync("image-result/worker-harness-proof.json",JSON.stringify({...proof,image:reference})+"\n");}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.role }}-${{ inputs.source_sha }}
          path: image-result/
          if-no-files-found: error

  package:
    needs: [gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-proof-${{ inputs.source_sha }}
          path: release-input/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*-${{ inputs.source_sha }}
          merge-multiple: true
          path: release-input/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Export the exact payload from the same Docker build stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ inputs.backend == 'harness' && 'release-package-harness' || 'release-package' }}
          platforms: linux/amd64
          push: false
          build-args: |
            SOURCE_SHA=${{ inputs.source_sha }}
            RELEASE_BACKEND=${{ inputs.backend }}
          outputs: type=local,dest=release-package
          cache-from: type=gha,scope=release-${{ inputs.source_sha }}
      - name: Finalize immutable OCI references without republishing Ontology
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" release-package
          node -e 'const fs=require("node:fs"),cp=require("node:child_process"),roles=["gateway","relay","worker"],candidate=JSON.parse(fs.readFileSync("release-package/manifest.json")),args=["scripts/release-artifacts.mjs","finalize","--root","release-package","--ci-proof","release-input/ci-proof.json"];for(const role of roles){const result=JSON.parse(fs.readFileSync(`release-input/${role}.json`)),proof=JSON.parse(fs.readFileSync(`release-input/${role}-payload.json`));if(result.role!==role||proof.sourceSha!==candidate.source.sha||proof.backend!==candidate.backend||proof.payloadDigest!==candidate.payloadDigest||proof.buildDigest!==candidate.runtime.buildDigest)throw Error("Published image payload differs from the selected release package");args.push(`--image-${role}`,result.reference);}if(process.env.BACKEND==="harness")args.push("--harness-image-proof","release-input/worker-harness-proof.json");cp.execFileSync(process.execPath,args,{stdio:"inherit"})'
          node scripts/release-artifacts.mjs verify --root release-package --require-ready
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.source_sha }}-${{ inputs.backend }}
          path: release-package/
          # Only the verified whitelist directory, including source/.dockerignore.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
