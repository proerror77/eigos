name: Container build smoke
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container-smoke.yml
      - .github/workflows/release-artifacts.yml
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/build.mjs
      - scripts/ontology.mjs
      - scripts/release-artifacts.mjs
      - scripts/smoke-harness-image.mjs
      - tests/harness-image-smoke.test.mjs
      - apps/**
      - packages/**
      - integrations/grok/**
permissions:
  contents: read
concurrency:
  group: container-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, worker-codex, worker-harness]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact PR source with no registry publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          tags: eigos-container-smoke:${{ matrix.target }}
          build-args: SOURCE_SHA=${{ github.event.pull_request.head.sha }}
          provenance: false
      - name: Read packaged entry points as the nonroot runtime user
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --entrypoint node --env SOURCE_SHA "eigos-container-smoke:$TARGET" -e 'const fs=require("node:fs");if(process.getuid()===0)throw Error("Runtime must be nonroot");for(const path of ["dist/apps/gateway/main.js","dist/apps/relay/main.js","dist/apps/worker/main.js","dist/integrations/grok/eigos-delegate/SKILL.md"]){fs.accessSync(path);}const manifest=JSON.parse(fs.readFileSync("release/manifest.json"));if(manifest.source.sha!==process.env.SOURCE_SHA||manifest.state!=="candidate")throw Error("Packaged source mismatch");'
      - name: Initialize the actual Harness SDK without a model turn or network
        if: matrix.target == 'worker-harness'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,mode=1777 --entrypoint node --env SOURCE_SHA --mount "type=bind,src=$PWD/scripts/smoke-harness-image.mjs,dst=/opt/eigos-smoke.mjs,readonly" eigos-container-smoke:worker-harness /opt/eigos-smoke.mjs
