name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      shards: ${{ steps.scope.outputs.shards }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate test selection
        run: node --test tests/ci-scope.test.mjs
      - id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/test-scope.mjs --ci
  verify:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a valid scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v4
        if: needs.scope.outputs.verify == 'true'
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.verify == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.scope.outputs.verify == 'true'
      - run: npm run check
        if: needs.scope.outputs.verify == 'true'
      - run: npm run build
        if: needs.scope.outputs.verify == 'true'
      - run: npm run test:e2e:run
        if: needs.scope.outputs.verify == 'true'
        env:
          EIGOS_TEST_FILES: ${{ needs.scope.outputs.e2e }}
      - name: Documentation scope
        if: needs.scope.outputs.verify == 'false'
        run: echo 'Documentation-only change; no runtime checks required.'
  relay-postgres:
    needs: scope
    if: ${{ needs.scope.result == 'success' && (contains(needs.scope.outputs.shards, 'tests/relay-postgres-import.test.ts') || contains(needs.scope.outputs.shards, 'tests/relay-postgres-grant.test.ts') || contains(needs.scope.outputs.shards, 'tests/business-postgres-schema.test.ts') || contains(needs.scope.outputs.shards, 'tests/business-postgres-import.test.ts') || contains(needs.scope.outputs.shards, 'tests/business-postgres-large-row.test.ts') || contains(needs.scope.outputs.shards, 'tests/membership-postgres-import.test.ts') || contains(needs.scope.outputs.shards, 'tests/postgres-identity-audit.test.ts') || contains(needs.scope.outputs.shards, 'tests/postgres-runtime-transaction.test.ts') || contains(needs.scope.outputs.shards, 'tests/postgres-work-authority.test.ts') || contains(needs.scope.outputs.shards, 'tests/postgres-ontology-release.test.ts') || contains(needs.scope.outputs.shards, 'tests/postgres-task-read-access.test.ts') || contains(needs.scope.outputs.shards, 'tests/relay-client-repoint.test.ts')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EIGOS_TEST_RELAY_POSTGRES: '1'
      EIGOS_TEST_PG_LOCAL: '1'
      EIGOS_TEST_LARGE_ROW: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: fixture-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/relay-postgres-import.test.ts tests/relay-postgres-grant.test.ts tests/business-postgres-schema.test.ts tests/business-postgres-import.test.ts tests/business-postgres-large-row.test.ts tests/membership-postgres-import.test.ts tests/postgres-identity-audit.test.ts tests/postgres-runtime-transaction.test.ts tests/postgres-work-authority.test.ts tests/postgres-ontology-release.test.ts tests/postgres-task-read-access.test.ts tests/postgres-projection-graph.test.ts tests/postgres-task-commands.test.ts tests/postgres-task-intents.test.ts tests/postgres-ontology-metadata.test.ts tests/postgres-ontology-query.test.ts tests/postgres-ontology-functions.test.ts tests/postgres-planning-context.test.ts tests/postgres-native-planning.test.ts tests/postgres-worker-read-lease.test.ts tests/postgres-worker-write-lease.test.ts tests/postgres-supabase-proxy.test.ts tests/relay-client-repoint.test.ts
  # Preserve required check names. Empty shards validate the scope without
  # installing dependencies or invoking Node's automatic test discovery.
  tests:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      EIGOS_TEST_FILES: ${{ needs.scope.result == 'success' && toJSON(fromJSON(needs.scope.outputs.shards)[matrix.shard]) || '[]' }}
    steps:
      - name: Require a valid scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v4
        if: env.EIGOS_TEST_FILES != '[]'
      - uses: actions/setup-node@v4
        if: env.EIGOS_TEST_FILES != '[]'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.EIGOS_TEST_FILES != '[]'
      - run: npm test
        if: env.EIGOS_TEST_FILES != '[]'
      - name: Empty shard
        if: env.EIGOS_TEST_FILES == '[]'
        run: echo 'No affected tests assigned to this shard.'
