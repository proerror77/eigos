name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a pull request run. Every main commit finishes, so it can be released.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      EIGOS_TEST_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run ontology:check
      - run: npm run test:e2e:run
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: list
        # scripts/test.mjs runs tests/NN-*.test.ts as suite NN, so a new suite needs no workflow edit.
        run: echo "suites=$(printf '%s\n' tests/[0-9][0-9]-*.test.ts | sed -nE 's#^tests/([0-9]{2})-.+\.test\.ts$#\1#p' | sort -u | jq -cRs '[splits("\n") | select(length > 0) | tonumber]')" >> "$GITHUB_OUTPUT"
  tests:
    needs: suites
    runs-on: ubuntu-latest
    # The query kernel suite compiles DataFusion first, and the function host suites compile wasmtime.
    timeout-minutes: ${{ (matrix.suite == '46' || matrix.suite == '49' || matrix.suite == '50' || matrix.suite == '52') && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.suites) }}
        include:
          - suite: vector
    services:
      postgres:
        image: ${{ matrix.suite == 'vector' && 'pgvector/pgvector:0.8.7-pg17' || 'postgres:17' }}
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      EIGOS_TEST_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: matrix.suite == '40'
        name: Install checksum-pinned agentgateway for the cutover rehearsal
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            -o "$RUNNER_TEMP/agentgateway" \
            https://github.com/agentgateway/agentgateway/releases/download/v1.7.0/agentgateway-linux-amd64
          printf '%s  %s\n' 1b2fc01a2de29ca113bbb6258b5cae7b1eb3c724071c09d687a449132f2f42f8 \
            "$RUNNER_TEMP/agentgateway" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/agentgateway"
          echo "EIGOS_TEST_CUTOVER_AGENTGATEWAY=$RUNNER_TEMP/agentgateway" >> "$GITHUB_ENV"
      - if: matrix.suite == '41'
        name: Build the spared quote pilot
        run: |
          scripts/prepare-spared-quote-pilot.sh "$RUNNER_TEMP/spared-quote"
          echo "EIGOS_TEST_SPARED_BIN=$RUNNER_TEMP/spared-quote/spared" >> "$GITHUB_ENV"
          echo "EIGOS_TEST_SPARED_WASM=$RUNNER_TEMP/spared-quote/quote.wasm" >> "$GITHUB_ENV"
      - if: matrix.suite == '46'
        name: Build the query kernel
        run: |
          cargo build --locked --manifest-path kernel/Cargo.toml
          echo "EIGOS_KERNEL_BIN=$GITHUB_WORKSPACE/kernel/target/debug/eigos-kernel" >> "$GITHUB_ENV"
      - if: matrix.suite == '52'
        name: Build the commit log archive codec
        run: |
          cargo build --locked --manifest-path kernel/Cargo.toml --bin eigos-archive
          echo "EIGOS_ARCHIVE_BIN=$GITHUB_WORKSPACE/kernel/target/debug/eigos-archive" >> "$GITHUB_ENV"
      - if: matrix.suite == '49' || matrix.suite == '50'
        name: Build the function host and its test components
        run: |
          rustup target add wasm32-wasip2
          cargo build --locked --manifest-path function-host/Cargo.toml
          function-host/fixtures/build.sh "$RUNNER_TEMP/function-fixtures"
          echo "EIGOS_FUNCTION_HOST_BIN=$GITHUB_WORKSPACE/function-host/target/debug/eigos-function-host" >> "$GITHUB_ENV"
          echo "EIGOS_FUNCTION_HOST_FIXTURES=$RUNNER_TEMP/function-fixtures" >> "$GITHUB_ENV"
      - if: matrix.suite == '49'
        name: Build the Function templates
        run: |
          out="$RUNNER_TEMP/function-templates"
          mkdir -p "$out"
          cargo build --release --locked --target wasm32-wasip2 --manifest-path templates/function-rust/Cargo.toml --target-dir "$out/rust"
          cp "$out/rust/wasm32-wasip2/release/eigos_function.wasm" "$out/rust.wasm"
          (cd templates/function-ts && npm ci --no-audit --no-fund && npm run build)
          cp templates/function-ts/function.wasm "$out/ts.wasm"
          echo "EIGOS_FUNCTION_TEMPLATES=$out" >> "$GITHUB_ENV"
      - if: matrix.suite == '49'
        name: Test both packaged Function templates offline
        run: |
          npm run build:function-test
          npm pack ./dist/function-test-package --ignore-scripts --pack-destination "$RUNNER_TEMP"
          for language in rust ts; do
            project="$RUNNER_TEMP/function-test-$language"
            mkdir -p "$project"
            cp "templates/function-$language/tests/offline.test.mjs" "$project/"
            npm install --prefix "$project" --offline --no-audit --no-fund "$RUNNER_TEMP/eigos-function-test-0.1.0.tgz"
            EIGOS_COMPONENT="$EIGOS_FUNCTION_TEMPLATES/$language.wasm" node --test "$project/offline.test.mjs"
          done
      - if: matrix.suite != 'vector'
        run: npm test -- --suite=${{ matrix.suite }}
      - if: matrix.suite == 'vector'
        env:
          EIGOS_TEST_PGVECTOR: 'true'
        run: node --import tsx --test tests/18-search.test.ts
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the Gateway and Worker images without publishing them
        run: |
          docker build --target runtime --tag eigos-ci:runtime .
          docker build --target worker --tag eigos-ci:worker .
      - run: scripts/container-smoke.sh eigos-ci:runtime eigos-ci:worker
  installed-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      EIGOS_TEST_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:5432/postgres
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
      - name: Install and verify two isolated EIGOS environments with the native executors
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/engines"
          cargo build --locked --manifest-path kernel/Cargo.toml --bin eigos-kernel
          cargo build --locked --manifest-path function-host/Cargo.toml
          strip "$CARGO_TARGET_DIR/debug/eigos-kernel" "$CARGO_TARGET_DIR/debug/eigos-function-host"
          export EIGOS_KERNEL_BIN="$CARGO_TARGET_DIR/debug/eigos-kernel"
          export EIGOS_FUNCTION_HOST_BIN="$CARGO_TARGET_DIR/debug/eigos-function-host"
          npm run package:vm
          EIGOS_TEST_VM_BUNDLE="$PWD/dist/vm" node --test dist/tests/e2e/vm-isolation.test.js
          tar -C dist/vm -czf "$RUNNER_TEMP/eigos-vm-linux-x64.tar.gz" .
          (cd "$RUNNER_TEMP" && sha256sum eigos-vm-linux-x64.tar.gz > eigos-vm-linux-x64.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eigos-vm-linux-x64
          retention-days: 14
          path: |
            ${{ runner.temp }}/eigos-vm-linux-x64.tar.gz
            ${{ runner.temp }}/eigos-vm-linux-x64.tar.gz.sha256
  result:
    name: CI result
    if: always()
    needs: [verify, suites, tests, container, installed-vm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
