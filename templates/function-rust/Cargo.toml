[package]
name = "eigos-function"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wit-bindgen = "=0.63.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

